plugins {
    id 'java-library'
    id 'maven-publish'
}

dependencies {
    api 'net.jodah:expiringmap:0.5.11'
    api 'commons-io:commons-io:2.19.0'
    api 'org.apache.commons:commons-text:1.13.1'
    api 'com.google.code.gson:gson:2.13.1'
    api 'com.fatboyindustrial.gson-javatime-serialisers:gson-javatime-serialisers:1.1.2'
    // MineDown 1.8.2 is vendored (patched for Adventure 5) under
    // src/main/java/de/themoep/minedown/adventure with an Adventure 4/5 compatibility
    // patch (Paper 26.2 ships Adventure 5.2.0, where ClickEvent.Action is no longer
    // an enum); the external dep is removed to avoid duplicate classes
    // DesertWell 2.0.4 and Paginedown 1.1.2 are absorbed as source in
    // net.william278.desertwell / net.william278.paginedown (self-contained spin-off, no
    // upstream artifact). DesertWell used to supply org.json transitively, so it is pinned
    // here directly - the shaded jar still needs those 14 classes.
    api 'org.json:json:20230227'
    // ClopLib 2.0.13 is absorbed as source in net.william278.cloplib (self-contained spin-off).
    // It needs configlib-yaml and adventure-key, which were previously transitive.
    api 'de.exlll:configlib-yaml:4.6.1'
    api 'net.kyori:adventure-key:4.24.0'
    api('com.zaxxer:HikariCP:6.3.0') {
        exclude module: 'slf4j-api'
    }

    compileOnly 'it.unimi.dsi:fastutil:8.5.16'
    compileOnly 'net.kyori:adventure-api:4.24.0'
    compileOnly 'net.kyori:adventure-platform-api:4.4.0'
    compileOnly 'org.jetbrains:annotations:26.0.2'
    compileOnly 'com.google.guava:guava:33.4.8-jre'
    compileOnly 'org.projectlombok:lombok:1.18.48'

    // Toilet 1.1.2 is absorbed as source in net.william278.toilet (self-contained spin-off).

    compileOnly 'net.luckperms:api:5.5'
    compileOnly 'com.github.BlueMap-Minecraft:BlueMapAPI:2.7.0'
    compileOnly 'us.dynmap:DynmapCoreAPI:3.6'
    compileOnly 'maven.modrinth:pl3xmap:1.21.10-537'
    compileOnly 'com.github.plan-player-analytics:Plan:5.6.2965'
    compileOnly 'com.sk89q.worldguard:worldguard-bukkit:7.0.9-SNAPSHOT'
    compileOnly('org.geysermc.floodgate:api:2.2.4-SNAPSHOT') {
        exclude group: 'com.google.code.gson'
    }

    testImplementation 'com.github.plan-player-analytics:Plan:5.6.2965'
    testImplementation 'net.kyori:adventure-api:4.24.0' // GUI test kit: real Settings defaults reference adventure colors
    testImplementation 'net.kyori:adventure-platform-api:4.4.0' // GUI test kit: Locales implements PaginatedListProvider

    testImplementation 'com.google.guava:guava:33.4.8-jre'
    testImplementation 'it.unimi.dsi:fastutil:8.5.16'
    testCompileOnly 'org.projectlombok:lombok:1.18.48'
    testAnnotationProcessor 'org.projectlombok:lombok:1.18.48'

    compileOnly "org.xerial:sqlite-jdbc:$sqlite_driver_version"
    compileOnly "com.mysql:mysql-connector-j:$mysql_driver_version"
    compileOnly "org.mariadb.jdbc:mariadb-java-client:$mariadb_driver_version"
    compileOnly "org.mongodb:mongodb-driver-sync:$mongodb_driver_version"
    compileOnly "redis.clients:jedis:$jedis_version"

    annotationProcessor 'org.projectlombok:lombok:1.18.48'
}